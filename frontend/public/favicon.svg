  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#538d4e" />
  <rect x="21" y="12.5" width="7" height="7" rx="1.5" fill="#3a3a3c" />
  <rect x="4" y="21" width="7" height="7" rx="1.5" fill="#b59f3b" />
